[project]
name = "silico-api"
version = "0.1.0"
description = "Backend API for the Silico marketing site and deterministic showcase demo"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "email-validator==2.2.0",
  "httpx==0.27.2",
]

[dependency-groups]
dev = [
  "pytest==8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
package = false
